# ─── CI: Lint, Type-Check, Test ──────────────────────────────────────
# Runs on every push/PR to validate code quality.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 22 (npm 11) fixes a known optional-dependencies-not-installed
        # bug in npm 10 that caused platform-specific rollup binaries
        # (@rollup/rollup-linux-x64-gnu, @rollup/rollup-win32-x64-msvc, etc.)
        # to silently fail to install during `npm ci`.
        # See https://github.com/npm/cli/issues/4828 for the upstream issue.
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Upgrade npm to 11
        # Node 22's bundled npm is still 10.x, which has two blocking
        # bugs for this lockfile:
        #   1. Missing parallel peer-dep trees on `npm ci` (complains
        #      about @types/react@18.x even though React 19 is direct dep)
        #   2. Platform-specific optionalDependencies silently skipped
        #      (npm/cli#4828) — breaks rollup's native binary selection
        # npm 11 fixes both. Pin explicitly rather than inheriting Node's.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3
        continue-on-error: true

      - name: Type-check (server)
        run: npx tsc --noEmit

      - name: Type-check (client)
        run: npx tsc --noEmit -p src/client/tsconfig.json

      - name: Run tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

      - name: Build check
        run: npm run build

      - name: Docs build check
        run: npm run docs:build
